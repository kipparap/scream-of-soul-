<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Алён, открытка</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    background: #ffe4e1;
    font-family: 'Comfortaa', cursive;
    text-align: center;
    padding: 30px 15px;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #333;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow-x: hidden;
  }
  #matrix-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
  }
  #screen1, #screen2, .footer-note {
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: 'Pacifico', cursive;
    color: #e91e63;
    font-size: clamp(1.5rem, 8vw, 2.8rem);
    margin-bottom: 5px;
    line-height: 1.1;
    transform: rotate(-1deg);
  }
  .hint {
    font-size: clamp(0.75rem, 3.5vw, 1rem);
    color: #999;
    margin: 0 0 15px;
    transform: rotate(0.5deg);
  }
  .envelope {
    font-size: clamp(4rem, 20vw, 7rem);
    cursor: pointer;
    margin: 20px;
    user-select: none;
    transition: transform 0.2s;
    display: inline-block;
  }
  .envelope:active { transform: scale(0.9) rotate(3deg); }

  .card {
    background: white;
    border-radius: 20px;
    padding: 25px 18px;
    max-width: 440px;
    width: 100%;
    box-shadow: 4px 6px 0 rgba(0,0,0,0.08);
    text-align: left;
    transform: rotate(0.3deg);
  }
  .card p {
    font-size: clamp(1rem, 4.5vw, 1.15rem);
    line-height: 1.5;
    margin: 10px 0;
    padding-left: 5px;
    border-left: 3px solid #ffb6c1;
  }
  .card .ps {
    font-size: clamp(0.8rem, 3.8vw, 0.95rem);
    color: #777;
    border-left: none;
    padding-left: 0;
    margin-top: 15px;
    font-style: italic;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 25px;
  }
  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    padding: 12px 25px;
    border-radius: 40px;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    min-height: 48px;
    transition: 0.15s;
    touch-action: manipulation;
  }
  #yes-btn {
    background: #e91e63;
    color: white;
    box-shadow: 3px 3px 0 #ad1457;
    transform: rotate(-1deg);
  }
  #yes-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #ad1457; }
  #no-btn {
    background: #ddd;
    color: #555;
    box-shadow: 2px 2px 0 #aaa;
    transition: transform 0.2s, opacity 0.2s;
  }
  #no-btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 #aaa; }
  #message {
    margin-top: 20px;
    font-size: clamp(1rem, 5vw, 1.3rem);
    font-weight: bold;
    color: #c2185b;
    min-height: 1.5em;
    text-align: center;
    transform: rotate(-0.5deg);
  }
  .hidden { display: none !important; }

  .footer-note {
    margin-top: 30px;
    font-size: 0.7rem;
    color: #b0a0a0;
    transform: rotate(1deg);
    max-width: 300px;
  }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div id="screen1">
  <h1>Алён, тебе письмо 💌</h1>
  <div class="envelope" id="open-btn" role="button">✉️</div>
  <p class="hint">нажми на конверт (пж)</p>
</div>

<div id="screen2" class="hidden">
  <div class="card">
    <p>Ой всё, Алён.</p>
    <p>Я устал ждать.</p>
    <p>Теперь мы с тобой встречаемся.</p>
    <p>Я тебя люблю, бебеб ❤️</p>
    <p class="ps">P.S. Тебя не спрашивали 😉</p>
    <div class="buttons">
      <button id="yes-btn" type="button">Да 💖</button>
      <button id="no-btn" type="button">Нет</button>
    </div>
    <div id="message"></div>
  </div>
</div>

<div class="footer-note">сделано на коленке с 20 процентным использованием ИИ</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  const s1 = document.getElementById('screen1');
  const s2 = document.getElementById('screen2');
  const openBtn = document.getElementById('open-btn');
  const yesBtn = document.getElementById('yes-btn');
  const noBtn = document.getElementById('no-btn');
  const msg = document.getElementById('message');

  openBtn.addEventListener('click', () => {
    s1.classList.add('hidden');
    s2.classList.remove('hidden');
    window.scrollTo(0, 0);
  });

  const noTexts = ['Нет', 'Ты уверена?', 'Подумай ещё', 'Алён, ну серьёзно', 'Не глупи 🙄'];
  let noCount = 0;

  noBtn.addEventListener('click', () => {
    noCount++;
    if (noCount < noTexts.length) {
      noBtn.textContent = noTexts[noCount];
      const scale = Math.max(0.5, 1 - noCount * 0.12);
      noBtn.style.transform = `scale(${scale}) rotate(${noCount * 2}deg)`;
      noBtn.style.opacity = String(Math.max(0.6, 1 - noCount * 0.1));
    } else {
      noBtn.style.display = 'none';
      msg.textContent = 'Всё, выбор сделан. Ты в отношениях. 😘';
    }
  });

  yesBtn.addEventListener('click', () => {
    confetti({
      particleCount: 150,
      spread: 90,
      origin: { y: 0.6 },
      scalar: 0.9
    });
    msg.textContent = 'Ну вот и всё. Теперь ты официально моя. Алён, не спрашивали. 😘';
    noBtn.style.display = 'none';
  });

  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  let w, h, cols, drops;
  const chars = '11.2022'.split('');

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / 22);
    drops = Array(cols).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);

  function drawMatrix() {
    ctx.fillStyle = 'rgba(255, 228, 225, 0.08)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255, 140, 160, 0.5)';
    ctx.font = '18px monospace';
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 22, drops[i] * 22);
      if (drops[i] * 22 > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 70);
</script>
</body>
</html>
